<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Categoría - SportStore</title>
    <style>
        body { background-color: #121212; color: white; font-family: sans-serif; margin: 0; padding-bottom: 80px;}
        header { display: flex; align-items: center; justify-content: space-between; padding: 20px 40px; background: #1e1e1e; border-bottom: 2px solid #ff5722; }
        .header-left { display: flex; align-items: center; gap: 20px; }
        h1 { color: #ff5722; margin: 0; }
        .btn-volver, .btn-carrito { background: #333; border: 1px solid #ff5722; color: #ff5722; padding: 8px 15px; border-radius: 5px; cursor: pointer; font-weight: bold; text-decoration: none; }
        .btn-carrito { position: relative; }
        .contador { background: red; color: white; border-radius: 50%; padding: 2px 6px; font-size: 12px; position: absolute; top: -10px; right: -10px; }
        
        /* Grid de productos */
        .productos-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 20px; padding: 40px; }
        .producto-card { background: #1e1e1e; padding: 15px; border-radius: 10px; border: 1px solid #333; display: flex; flex-direction: column; }
        .producto-img { width: 100%; height: 200px; object-fit: contain; background-color: #fff; border-radius: 8px; margin-bottom: 15px; }
        .precio { color: #ff5722; font-size: 24px; font-weight: bold; margin: 5px 0; }
        .stock { font-size: 12px; color: #aaa; margin-bottom: 10px; }
        select { width: 100%; padding: 8px; margin-bottom: 10px; border-radius: 5px; border: none; background: #333; color: white; }
        .btn-agregar { width: 100%; padding: 10px; background: #ff5722; color: white; border: none; border-radius: 5px; cursor: pointer; font-weight: bold; transition: 0.3s; }
        .btn-agregar:hover { background: #e64a19; }
        .btn-agregar:disabled { background: #555; cursor: not-allowed; }

        /* Modal del Carrito */
        #modal-carrito { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); justify-content: center; align-items: center; z-index: 1000;}
        .carrito-contenido { background: #1e1e1e; padding: 30px; border-radius: 10px; width: 400px; max-width: 90%; border: 1px solid #333; }
        .carrito-item { display: flex; justify-content: space-between; border-bottom: 1px solid #333; padding: 10px 0; }
        .btn-pagar { width: 100%; padding: 15px; background: #555; color: #aaa; border: none; border-radius: 5px; font-weight: bold; margin-top: 20px; cursor: not-allowed; }
    </style>
</head>
<body>
    <header>
        <div class="header-left">
            <a href="tienda.html" class="btn-volver">← Volver</a>
            <h1 id="titulo-categoria">Cargando...</h1>
        </div>
        <button class="btn-carrito" onclick="abrirCarrito()">
            🛒 Carrito <span id="contador-carrito" class="contador">0</span>
        </button>
    </header>

    <main id="productos-container" class="productos-grid"></main>

    <!-- Modal del Carrito -->
    <div id="modal-carrito">
        <div class="carrito-contenido">
            <h2>Tu Carrito</h2>
            <div id="lista-carrito"></div>
            
            <!-- Total a pagar -->
            <div style="display: flex; justify-content: space-between; margin-top: 20px; font-size: 20px; font-weight: bold; color: #ff5722;">
                <span>Total:</span>
                <span id="total-carrito">$0.00</span>
            </div>

            <button class="btn-pagar" disabled>Pagar (Próximamente)</button>
            <button onclick="cerrarCarrito()" style="width: 100%; padding: 10px; background: transparent; color: white; border: none; margin-top: 10px; cursor: pointer;">Cerrar</button>
        </div>
    </div>

    <script type="module">
        import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js/+esm'
        
        const response = await fetch('/api/config');
        const config = await response.json();
        const supabase = createClient(config.url, config.key);

        let carrito = [];
        const urlParams = new URLSearchParams(window.location.search);
        const categoria = urlParams.get('cat');
        
        if(categoria) {
            document.getElementById('titulo-categoria').textContent = categoria;
            cargarProductos(categoria);
        }

        async function cargarProductos(cat) {
            const container = document.getElementById('productos-container');
            const { data: productos, error } = await supabase.from('productos').select('*').eq('categoria', cat);

            if (error || productos.length === 0) {
                container.innerHTML = `<p>No hay productos en esta categoría.</p>`;
                return;
            }

            productos.forEach(prod => {
                const opcionesTallas = (prod.tallas || 'Unica').split(',').map(t => `<option value="${t.trim()}">${t.trim()}</option>`).join('');
                const sinStock = !prod.stock || prod.stock <= 0;
                
                const div = document.createElement('div');
                div.className = 'producto-card';
                div.innerHTML = `
                    <img src="${prod.imagen_url || 'https://via.placeholder.com/150'}" alt="${prod.nombre}" class="producto-img">
                    <h3>${prod.nombre}</h3>
                    <p class="precio">$${prod.precio}</p>
                    <p class="stock">Stock: ${prod.stock || 0}</p>
                    <select id="talla-${prod.id}" ${sinStock ? 'disabled' : ''}>
                        ${opcionesTallas}
                    </select>
                    <button class="btn-agregar" ${sinStock ? 'disabled' : ''} onclick="agregarAlCarrito(${prod.id}, '${prod.nombre}', ${prod.precio})">
                        ${sinStock ? 'Agotado' : 'Agregar al carrito'}
                    </button>
                `;
                container.appendChild(div);
            });
        }

        window.agregarAlCarrito = (id, nombre, precio) => {
            const select = document.getElementById(`talla-${id}`);
            const talla = select ? select.value : 'Unica';
            carrito.push({ nombre, precio, talla });
            actualizarCarrito();
        }

        function actualizarCarrito() {
            document.getElementById('contador-carrito').textContent = carrito.length;
            const lista = document.getElementById('lista-carrito');
            lista.innerHTML = '';
            
            let total = 0;

            carrito.forEach((item) => {
                total += parseFloat(item.precio);

                lista.innerHTML += `
                    <div class="carrito-item">
                        <div>
                            <strong>${item.nombre}</strong><br>
                            <small>Talla: ${item.talla}</small>
                        </div>
                        <span>$${item.precio}</span>
                    </div>
                `;
            });

            // Actualizamos el total en pantalla
            document.getElementById('total-carrito').textContent = `$${total.toFixed(2)}`;
        }

        window.abrirCarrito = () => document.getElementById('modal-carrito').style.display = 'flex';
        window.cerrarCarrito = () => document.getElementById('modal-carrito').style.display = 'none';
    </script>
</body>
</html>
