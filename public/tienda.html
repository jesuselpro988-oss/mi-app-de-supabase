<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Catálogo - SportStore</title>
    <style>
        body { background-color: #121212; color: white; font-family: sans-serif; margin: 0; }
        header { display: flex; justify-content: space-between; align-items: center; padding: 20px 40px; background: #1e1e1e; border-bottom: 2px solid #ff5722; }
        h1 { color: #ff5722; margin: 0; }
        .btn-salir { background: transparent; border: 1px solid #ff5722; color: #ff5722; padding: 8px 15px; border-radius: 5px; cursor: pointer; font-weight: bold; }
        .categorias-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 20px; padding: 40px; }
        .card { background: #1e1e1e; padding: 40px 20px; text-align: center; border-radius: 10px; font-size: 20px; font-weight: bold; border: 1px solid #333; transition: 0.3s; display: block; color: white; text-decoration: none; }
        .card:hover { transform: translateY(-5px); border-color: #ff5722; box-shadow: 0 5px 15px rgba(255, 87, 34, 0.3); }
        .ayuda-flotante { position: fixed; bottom: 30px; right: 30px; }
        .ayuda-flotante a { background: #ff5722; color: white; padding: 15px 25px; border-radius: 50px; font-weight: bold; text-decoration: none; box-shadow: 0 4px 10px rgba(0,0,0,0.5); }
    </style>
</head>
<body>
    <header>
        <h1>SportStore</h1>
        <button onclick="cerrarSesion()" class="btn-salir">Cerrar Sesión</button>
    </header>

    <main class="categorias-grid">
        <a href="categoria.html?cat=Accesorios" class="card">Accesorios</a>
        <a href="categoria.html?cat=Camisas" class="card">Camisas</a>
        <a href="categoria.html?cat=Pantalones" class="card">Pantalones</a>
        <a href="categoria.html?cat=Calzado" class="card">Calzado</a>
        <a href="categoria.html?cat=Suplementos" class="card">Suplementos</a>
        <a href="categoria.html?cat=Conjuntos" class="card">Conjuntos</a>
    </main>

    <div class="ayuda-flotante">
        <a href="ayuda.html">❓ Ayuda y Contacto</a>
    </div>

    <script type="module">
        import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js/+esm'
        
        const response = await fetch('/api/config');
        const config = await response.json();
        const supabase = createClient(config.url, config.key);

        const { data: { session } } = await supabase.auth.getSession();
        if (!session) window.location.href = 'index.html';

        window.cerrarSesion = async () => {
            await supabase.auth.signOut();
            window.location.href = 'index.html';
        }
    </script>
</body>
</html>
